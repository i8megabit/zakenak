name: Build Zakenak

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: true
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        cache: true

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('tools/zakenak/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Setup Go workspace
      working-directory: ./tools/zakenak
      run: |
        go mod tidy
        mkdir -p build

    - name: Install staticcheck
      run: go install honnef.co/go/tools/cmd/staticcheck@latest

    - name: Run staticcheck
      working-directory: ./tools/zakenak
      run: staticcheck ./...

    - name: Install govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@latest

    - name: Run govulncheck
      working-directory: ./tools/zakenak
      run: govulncheck ./...
      continue-on-error: true

    - name: Build Binary
      working-directory: ./tools/zakenak
      run: |
        go build -o build/zakenak ./cmd/zakenak
      
    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: tools/zakenak
        file: tools/zakenak/Dockerfile
        push: false
        tags: ghcr.io/i8megabit/zakenak:${{ github.sha }}

    - name: Run tests with coverage
      working-directory: ./tools/zakenak
      run: |
        go test -v -coverprofile=build/coverage.out ./...
        go tool cover -func=build/coverage.out > build/coverage.txt
        go tool cover -html=build/coverage.out -o build/coverage.html

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: |
          tools/zakenak/build/coverage.out
          tools/zakenak/build/coverage.txt
          tools/zakenak/build/coverage.html
        retention-days: 5

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: zakenak
        path: tools/zakenak/build/zakenak
        compression-level: 9
        retention-days: 5

    - name: Login to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push Docker image
      if: github.event_name != 'pull_request'
      uses: docker/build-push-action@v5
      with:
        context: tools/zakenak
        file: tools/zakenak/Dockerfile
        push: true
        tags: |
          ghcr.io/i8megabit/zakenak:${{ github.sha }}
          ghcr.io/i8megabit/zakenak:latest