name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Extract version from README
        id: version
        run: |
          VER=$(grep -oP 'v[0-9]+\.[0-9]+\.[0-9]+' README.md | head -n 1)
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "VER_NUM=${VER#v}" >> "$GITHUB_ENV"

      - name: Set docker tags
        id: docker_tags
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          IMAGE=ghcr.io/i8megabit/zakenak
          if [ "$BRANCH" = "develop" ]; then
            {
              echo "tags<<EOF"
              echo "$IMAGE:develop"
              echo "$IMAGE:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          elif [ "$BRANCH" = "main" ]; then
            MAJOR=$(echo $VER_NUM | cut -d. -f1)
            MINOR=$(echo $VER_NUM | cut -d. -f1,2)
            {
              echo "tags<<EOF"
              echo "$IMAGE:prod"
              echo "$IMAGE:$VER_NUM"
              echo "$IMAGE:$MINOR"
              echo "$IMAGE:$MAJOR"
              echo "$IMAGE:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "tags<<EOF"
              echo "$IMAGE:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('tools/zakenak/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Setup Go workspace
        working-directory: ./tools/zakenak
        run: |
          go mod tidy
          mkdir -p build

      - name: Build Binary
        working-directory: ./tools/zakenak
        run: |
          go build -o build/zakenak ./cmd/zakenak

      - name: Run tests
        working-directory: ./tools/zakenak
        run: make test

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: tools/zakenak
          file: tools/zakenak/Dockerfile
          push: true
          tags: ${{ steps.docker_tags.outputs.tags }}

      - name: Create git tag
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag -a "v$VER_NUM" -m "Release v$VER_NUM"
          git push origin "v$VER_NUM"

      - name: Merge to develop with version bump
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git fetch origin develop
          git checkout develop
          git merge --no-ff $GITHUB_SHA -m "chore: merge main into develop"
          NEXT=$(echo $VER_NUM | awk -F. '{print $1"."$2"."$3+1}')
          sed -i "s/v$VER_NUM/v$NEXT/" README.md
          git commit -am "chore: bump version to v$NEXT"
          git push origin develop

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zakenak
          path: tools/zakenak/build/zakenak
          retention-days: 5
