{{- if .Values.clusterIssuer.enabled }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.clusterIssuer.name }}
  namespace: {{ .Values.release.namespace }}
spec:
  {{- if eq .Values.clusterIssuer.type "letsencrypt" }}
  acme:
    email: {{ .Values.clusterIssuer.email }}
    server: {{ .Values.clusterIssuer.server }}
    privateKeySecretRef:
      name: {{ .Values.clusterIssuer.privateKeySecretRef }}
    solvers:
    {{- range .Values.clusterIssuer.solvers }}
    - {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- else if eq .Values.clusterIssuer.type "selfsigned" }}
  selfSigned: {}
  {{- end }}

{{- if eq .Values.clusterIssuer.type "selfsigned" }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.release.namespace }}-local-ca
  namespace: {{ .Values.release.namespace }}
spec:
  isCA: true
  commonName: "*.{{ .Values.release.namespace }}.local"
  secretName: {{ .Values.release.namespace }}-local-ca
  privateKey:
    algorithm: ECDSA
    size: 256
  dnsNames:
    - "*.{{ .Values.release.namespace }}.local"
    - "{{ .Values.release.namespace }}.local"
  issuerRef:
    name: {{ .Values.clusterIssuer.name }}
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.release.namespace }}-local-issuer
  namespace: {{ .Values.release.namespace }}
spec:
  ca:
    secretName: {{ .Values.release.namespace }}-local-ca
{{- end }}
{{- end }}