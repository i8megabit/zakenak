# Production values for kubernetes-dashboard chart
kubernetes-dashboard:
  extraArgs:
    - --token-ttl=43200
    - --enable-skip-login
    - --enable-insecure-login
    - --disable-settings-authorizer
  protocolHttp: true
  service:
    type: ClusterIP
  rbac:
    clusterReadOnlyRole: true
    create: true
  serviceAccount:
    create: true
    name: kubernetes-dashboard
  metricsScraper:
    enabled: true
  ingress:
    enabled: true
    className: nginx
    hosts:
      - dashboard.eberil.ru
    paths:
      - /
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
      cert-manager.io/cluster-issuer: "letsencrypt-issuer"
    tls:
      - secretName: dashboard-eberil-ru-tls
        hosts:
          - dashboard.eberil.ru
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 100m
      memory: 200Mi
  tolerations:
    - effect: NoSchedule
      operator: Exists